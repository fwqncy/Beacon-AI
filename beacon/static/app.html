<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5M4 4v4.5h4.5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="sidebar" aria-label="Chats">
    <div class="sidebar-top">
      <a class="brand" href="/" data-nav><img class="brand-mark" src="/static/logo.svg" alt="">beacon</a>
      <button class="icon-btn" id="collapse" title="Close sidebar" aria-label="Close sidebar"><svg class="icon"><use href="#i-panel"/></svg></button>
    </div>
    <button class="new-chat" id="newChat"><svg class="icon"><use href="#i-plus"/></svg>New chat<kbd>⇧⌘O</kbd></button>
    <div class="section-label">Recents</div>
    <nav class="chat-list" id="chatList"></nav>
    <div class="account">
      <div class="menu" id="menu" hidden>
        <div class="menu-email" id="menuEmail"></div>
        <button id="logout"><svg class="icon"><use href="#i-logout"/></svg>Sign out</button>
      </div>
      <button class="account-btn" id="accountBtn" aria-haspopup="menu">
        <span class="avatar" id="avatar"></span>
        <span class="account-meta"><strong id="userName"></strong><small id="userTeam"></small></span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main is-empty" id="main">
    <header class="topbar">
      <button class="icon-btn show-when-collapsed" id="expand" title="Open sidebar" aria-label="Open sidebar"><svg class="icon"><use href="#i-panel"/></svg></button>
      <button class="icon-btn show-when-collapsed" id="newChatTop" title="New chat" aria-label="New chat"><svg class="icon"><use href="#i-plus"/></svg></button>
      <div class="title" id="chatTitle"></div>
      <div class="spacer"></div>
    </header>

    <div class="scroll" id="scroll">
      <div class="welcome" id="welcome">
        <img class="brand-mark" src="/static/logo.svg" alt="">
        <h1 id="greeting">Hello</h1>
        <p>Ask anything about how we work. Every answer links back to its source page.</p>
      </div>
      <div class="column"><div class="messages" id="messages"></div></div>
    </div>

    <div class="dock">
      <div class="column">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask anything about how we work…" aria-label="Message Beacon"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg class="icon up"><use href="#i-up"/></svg>
            <svg class="icon stop"><use href="#i-stop"/></svg>
          </button>
        </form>
      </div>
      <div class="suggestions" id="suggestions">
        <button class="suggestion"><small>IT</small>How do I order a new laptop for a starter?</button>
        <button class="suggestion"><small>Time off</small>How many days of annual leave do I get?</button>
        <button class="suggestion"><small>Expenses</small>What's the deadline for submitting expense claims?</button>
        <button class="suggestion"><small>Security</small>How do I report a security incident?</button>
      </div>
      <p class="disclaimer">Beacon answers only from documents your team can access. Check the source before acting on anything important.</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
