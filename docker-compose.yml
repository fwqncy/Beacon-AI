# Postgres 17 with pgvector, for running Arachne without a local Postgres install.
#   docker compose up -d
#   DATABASE_URL=postgresql://arachne:arachne@localhost:5433/arachne_app
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: arachne
      POSTGRES_PASSWORD: arachne
      POSTGRES_DB: arachne_app
    ports:
      - "5433:5432"
    volumes:
      - arachne-db:/var/lib/postgresql/data

volumes:
  arachne-db:
