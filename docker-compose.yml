# Postgres 17 with pgvector, for running Beacon without a local Postgres install.
#   docker compose up -d
#   DATABASE_URL=postgresql://beacon:beacon@localhost:5433/beacon_app
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon_app
    ports:
      - "5433:5432"
    volumes:
      - beacon-db:/var/lib/postgresql/data

volumes:
  beacon-db:
